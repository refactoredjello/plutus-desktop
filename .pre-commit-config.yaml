repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: bash -c 'cd api && uv run ruff check --fix . && uv run ruff format .'
        language: system
        files: ^api/
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: bash -c 'cd api && uv run mypy app'
        language: system
        files: ^api/.*\.py$
        pass_filenames: false
      - id: oxlint
        name: oxlint
        entry: bash -c 'cd web && npx oxlint'
        language: system
        files: ^web/src/
        pass_filenames: false
