name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Lint, typecheck, and test web, server, and desktop
        run: npm run check
      - name: Generated client is current
        run: npm run gen:api --workspace web && git diff --exit-code web/src/api/schema.d.ts

  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Unsigned desktop build
        run: npm run dist --workspace desktop
