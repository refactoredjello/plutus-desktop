name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Lint, typecheck, and test web, server, and desktop
        run: npm run check
      - name: Generated client is current
        run: npm run gen:api --workspace web && git diff --exit-code web/src/api/schema.d.ts

  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Ad hoc signed desktop build, dmg and zip for arm64 and x64
        run: npm run dist --workspace desktop
        env:
          # No certificate here: the build is signed ad hoc. electron-builder skips all signing
          # on pull requests unless this is set; there are no secrets to protect.
          CSC_FOR_PULL_REQUEST: 'true'
      - name: Signature verifies
        run: codesign --verify --deep --strict desktop/release/mac-arm64/Plutus.app
      - name: Packaged app opens and reaches the API
        run: npm run smoke:dist --workspace desktop
      - uses: actions/upload-artifact@v4
        with:
          name: plutus-macos
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error
          retention-days: 14
