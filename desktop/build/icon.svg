<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Plutus app icon (original artwork). Regenerate icon.icns with
       `npm run icons` in desktop/ (scripts/icons.sh, macOS). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f8a70"/>
      <stop offset="1" stop-color="#0e4d3f"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#e9a923"/>
    </linearGradient>
  </defs>
  <!-- The macOS grid: an 824 px tile centred on the 1024 px canvas. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <!-- Three rising bars. -->
  <rect x="262" y="560" width="120" height="220" rx="28" fill="#ffffff" fill-opacity="0.92"/>
  <rect x="452" y="460" width="120" height="320" rx="28" fill="#ffffff" fill-opacity="0.92"/>
  <rect x="642" y="360" width="120" height="420" rx="28" fill="#ffffff" fill-opacity="0.92"/>
  <!-- A coin above the tallest bar. -->
  <circle cx="702" cy="252" r="72" fill="url(#coin)"/>
  <circle cx="702" cy="252" r="46" fill="none" stroke="#b97d10" stroke-width="12" stroke-opacity="0.55"/>
</svg>
